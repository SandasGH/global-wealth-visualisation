<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Development Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://unpkg.com/d3-geo-projection@4/dist/d3-geo-projection.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0f1117;
  color: #e0e0e0;
  font-family: 'Segoe UI', Arial, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────── */
#header {
  padding: 10px 24px 8px;
  border-bottom: 1px solid #252535;
  flex-shrink: 0;
}
#header h1 {
  font-size: 1.15rem;
  font-weight: 600;
  color: #ffffff;
  letter-spacing: 0.06em;
  margin-bottom: 7px;
}
#slider-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
#slider-row label {
  font-size: 0.8rem;
  color: #888;
  white-space: nowrap;
}
#year-slider {
  -webkit-appearance: none;
  width: 380px;
  height: 4px;
  background: #252535;
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
#year-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 15px; height: 15px;
  border-radius: 50%;
  background: #e8712a;
  cursor: pointer;
}
#year-slider::-moz-range-thumb {
  width: 15px; height: 15px;
  border-radius: 50%;
  background: #e8712a;
  border: none;
  cursor: pointer;
}
#year-display {
  font-size: 1.05rem;
  font-weight: 700;
  color: #e8712a;
  min-width: 44px;
}
.tick-labels {
  display: flex;
  justify-content: space-between;
  width: 380px;
  font-size: 0.65rem;
  color: #555;
  margin-top: 2px;
}

/* ── Two-panel layout ───────────────────────────── */
#panels {
  display: flex;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}
#map-panel {
  flex: 55;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #252535;
  padding: 6px 8px 4px 8px;
  min-width: 0;
}
#scatter-panel {
  flex: 45;
  display: flex;
  flex-direction: column;
  padding: 6px 8px 4px 8px;
  min-width: 0;
}
.panel-title {
  font-size: 0.72rem;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 4px;
  flex-shrink: 0;
}
#map-svg {
  flex: 1;
  width: 100%;
  min-height: 0;
}
#map-legend-row {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 0 1px;
}
#scatter-svg {
  flex: 1;
  width: 100%;
  min-height: 0;
}

/* ── Region filter buttons ──────────────────────── */
#region-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 5px;
  flex-shrink: 0;
}
.region-btn {
  font-size: 0.68rem;
  padding: 2px 9px;
  border-radius: 11px;
  border: 1px solid currentColor;
  cursor: pointer;
  background: transparent;
  color: inherit;
  transition: opacity 0.2s, background 0.2s;
  user-select: none;
}
.region-btn:hover { background: rgba(255,255,255,0.07); }
.region-btn.hidden-region { opacity: 0.25; }

/* ── Tooltip ────────────────────────────────────── */
#tooltip {
  position: fixed;
  pointer-events: none;
  background: rgba(10,11,18,0.97);
  border: 1px solid #333345;
  border-radius: 6px;
  padding: 9px 13px;
  font-size: 0.76rem;
  line-height: 1.65;
  color: #ddd;
  display: none;
  z-index: 999;
  max-width: 230px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.6);
}
#tooltip .tt-name {
  font-weight: 700;
  color: #fff;
  font-size: 0.82rem;
  margin-bottom: 3px;
}
#tooltip .tt-region {
  font-size: 0.7rem;
  margin-top: 2px;
}
#tooltip .tt-missing {
  font-size: 0.68rem;
  color: #888;
  font-style: italic;
}

/* ── Map SVG elements ───────────────────────────── */
.country-path {
  stroke: #1a1a2e;
  stroke-width: 0.35px;
  cursor: pointer;
  transition: stroke-width 0.1s;
}
.country-path:hover { stroke: #fff; stroke-width: 1.2px; }
.sphere-bg { fill: #12121f; }
.graticule { fill: none; stroke: #1e1e30; stroke-width: 0.4px; }
.map-border { fill: none; stroke: #333355; stroke-width: 0.8px; }

/* ── Scatter SVG elements ───────────────────────── */
.scatter-dot { cursor: pointer; }
.traj-path {
  fill: none;
  stroke: #ffffff;
  stroke-width: 1.8px;
  stroke-dasharray: 5 3;
  opacity: 0.65;
  pointer-events: none;
}
.traj-label {
  fill: #ddd;
  font-size: 8.5px;
  pointer-events: none;
}
.traj-dot {
  fill: #fff;
  opacity: 0.5;
}
.axis-label {
  fill: #777;
  font-size: 10.5px;
}
.grid line { stroke: #1e1e2e; stroke-dasharray: 3 2; }
.grid .domain { display: none; }
</style>
</head>
<body>

<div id="header">
  <h1>Global Development Indicators - GDP, Education &amp; Human Development (2000–2020)</h1>
  <div id="slider-row">
    <label>Year:</label>
    <div>
      <input type="range" id="year-slider" min="2000" max="2020" step="1" value="2010">
      <div class="tick-labels">
        <span>2000</span><span>2005</span><span>2010</span><span>2015</span><span>2020</span>
      </div>
    </div>
    <span id="year-display">2010</span>
  </div>
</div>

<div id="panels">
  <!-- LEFT: Choropleth Map -->
  <div id="map-panel">
    <div class="panel-title">GDP per Capita (USD) - Choropleth</div>
    <svg id="map-svg"></svg>
    <div id="map-legend-row"></div>
  </div>

  <!-- RIGHT: Scatter Plot -->
  <div id="scatter-panel">
    <div class="panel-title">GDP per Capita vs Secondary School Enrollment</div>
    <div id="region-filters"></div>
    <svg id="scatter-svg"></svg>
  </div>
</div>

<div id="tooltip"></div>

<script>

//  CONSTANTS & STATE

const YEARS = d3.range(2000, 2021);   // [2000 … 2020]

const REGIONS = [
  "East Asia & Pacific",
  "Europe & Central Asia",
  "Latin America & Caribbean",
  "Middle East & North Africa",
  "North America",
  "South Asia",
  "Sub-Saharan Africa"
];

const REGION_SHORT = {
  "East Asia & Pacific":        "E. Asia & Pacific",
  "Europe & Central Asia":      "Europe & C. Asia",
  "Latin America & Caribbean":  "Lat. Am. & Carib.",
  "Middle East & North Africa": "M. East & N. Africa",
  "North America":              "North America",
  "South Asia":                 "South Asia",
  "Sub-Saharan Africa":         "Sub-Saharan Africa"
};

const REGION_COLORS = d3.scaleOrdinal()
  .domain(REGIONS)
  .range(["#4fc3f7","#81c784","#ffb74d","#ce93d8","#ef5350","#fff176","#ff8a65"]);

let selectedYear    = 2010;
let selectedCountry = null;   // null = default mode; object = focus mode
const hiddenRegions = new Set();

let countriesArr = [];
let isoLookup    = new Map();   // iso_numeric (number) → country
let codeToIso    = new Map();   // country_code → iso_numeric

let gdpColorScale;
let xScale, yScale;
let scatterG, mapG;
let clearBtnG;   // SVG group for "✕ Clear selection"


//  TOOLTIP

const ttDiv = d3.select("#tooltip");

function fmt(v, prefix = "", suffix = "", decimals = 0) {
  if (v == null || !isFinite(v)) return "N/A";
  return prefix + d3.format(decimals === 0 ? ",.0f" : `,.${decimals}f`)(v) + suffix;
}

function showTip(event, d) {
  const yr = d.years[selectedYear] || {};
  const missing = yr.enrollment_missing;
  ttDiv.html(`
    <div class="tt-name">${d.country_name}</div>
    <div>GDP/capita: ${fmt(yr.gdp_per_capita, "$")}</div>
    <div>Enrollment: ${fmt(yr.school_enrollment_secondary, "", "%", 1)}${missing ? ' <span class="tt-missing">(est.)</span>' : ''}</div>
    <div>HDI: ${fmt(yr.human_development_index, "", "", 3)}</div>
    <div>Life exp.: ${fmt(yr.life_expectancy, "", " yrs", 1)}</div>
    <div class="tt-region" style="color:${REGION_COLORS(d.region)}">${d.region}</div>
  `)
  .style("display", "block");
  moveTip(event);
}

function moveTip(event) {
  const px = event.clientX, py = event.clientY;
  const ttW = 230, ttH = 120;
  const left = (px + 16 + ttW > window.innerWidth)  ? px - ttW - 8  : px + 16;
  const top  = (py - 10 + ttH > window.innerHeight) ? py - ttH - 4  : py - 10;
  ttDiv.style("left", left + "px").style("top", top + "px");
}

function hideTip() { ttDiv.style("display", "none"); }


//  DATA HELPERS

// Returns true only when BOTH gdp and enrollment are valid for this year
function hasValidData(country, year) {
  const yr  = country.years[year];
  if (!yr) return false;
  const gdp = yr.gdp_per_capita;
  const enr = yr.school_enrollment_secondary;
  return gdp != null && isFinite(gdp) && gdp > 0 &&
         enr != null && isFinite(enr);
}

function getScatterX(country, year) {
  const yr = country.years[year];
  if (!yr) return null;
  const v = yr.gdp_per_capita;
  return (v != null && isFinite(v) && v > 0) ? xScale(v) : null;
}

function getScatterY(country, year) {
  const yr = country.years[year];
  if (!yr) return null;
  const v = yr.school_enrollment_secondary;
  return (v != null && isFinite(v)) ? yScale(v) : null;
}

// Dot visible in default mode: region not hidden AND both values valid
function defaultDotVisible(d) {
  if (hiddenRegions.has(d.region)) return false;
  return hasValidData(d, selectedYear);
}

// Three-state appearance for a default-mode dot at a given year:
//   "full"  — both values valid: normal dot
//   "ghost" — gdp valid, enrollment null, last known y position found
//   "hide"  — gdp missing, or no prior enrollment at all
function defaultDotState(d, year) {
  if (hiddenRegions.has(d.region)) return { mode: "hide" };
  const x  = getScatterX(d, year);
  const yv = getScatterY(d, year);
  if (x !== null && yv !== null) return { mode: "full",  cx: x,    cy: yv   };
  if (x !== null) {
    const last = getLastKnownPos(d, year);
    if (last) return { mode: "ghost", cx: last.x, cy: last.y };
  }
  return { mode: "hide" };
}

//  COLOR SCALE

function buildGdpColorScale() {
  const vals = [];
  countriesArr.forEach(c => {
    YEARS.forEach(y => {
      const v = c.years[y]?.gdp_per_capita;
      if (v != null && isFinite(v) && v > 0) vals.push(v);
    });
  });
  vals.sort(d3.ascending);
  const cap = d3.quantile(vals, 0.97);
  const sqrtScale = d3.scalePow().exponent(0.4).domain([0, cap]).range([0, 1]).clamp(true);
  const colorFn = v => d3.interpolateYlOrRd(sqrtScale(v));
  colorFn._sqrtScale = sqrtScale;
  colorFn._cap = cap;
  return colorFn;
}

function mapColor(isoId) {
  const c = isoLookup.get(parseInt(isoId, 10));
  if (!c) return "#252535";
  const yr = c.years[selectedYear];
  const v  = yr?.gdp_per_capita;
  if (v == null || !isFinite(v) || v <= 0) return "#2e2e3e";
  return gdpColorScale(v);
}


//  CHOROPLETH MAP

function initMap(topo) {
  const el   = document.getElementById("map-svg");
  const rect = el.getBoundingClientRect();
  const W    = rect.width  || 700;
  const H    = rect.height || 420;

  const svg = d3.select("#map-svg");
  mapG      = svg.append("g");

  const projection = d3.geoEckert6().fitSize([W, H], { type: "Sphere" });
  const path       = d3.geoPath().projection(projection);

  mapG.append("path").datum({ type: "Sphere" })
    .attr("class", "sphere-bg").attr("d", path);

  mapG.append("path").datum(d3.geoGraticule()())
    .attr("class", "graticule").attr("d", path);

  const features = topojson.feature(topo, topo.objects.countries).features;

  mapG.selectAll(".country-path")
    .data(features, d => d.id)
    .join("path")
      .attr("class", "country-path")
      .attr("d", path)
      .attr("fill", d => mapColor(d.id))
      .on("mouseover", function(event, d) {
        const c = isoLookup.get(parseInt(d.id, 10));
        if (c) { showTip(event, c); d3.select(this).raise(); }
      })
      .on("mousemove", moveTip)
      .on("mouseout",  () => hideTip())
      .on("click",     function(event, d) {
        const c = isoLookup.get(parseInt(d.id, 10));
        if (c) handleCountrySelect(c);
      });

  mapG.append("path").datum({ type: "Sphere" })
    .attr("class", "map-border").attr("d", path);

  buildMapLegend(W);
}

function updateMapColors() {
  mapG.selectAll(".country-path")
    .transition().duration(450)
    .attr("fill", d => mapColor(d.id));
}

function updateMapHighlight() {
  mapG.selectAll(".country-path")
    .attr("stroke", d => {
      if (!selectedCountry) return "#1a1a2e";
      const c = isoLookup.get(parseInt(d.id, 10));
      return (c && c.country_code === selectedCountry.country_code) ? "#fff" : "#1a1a2e";
    })
    .attr("stroke-width", d => {
      if (!selectedCountry) return 0.35;
      const c = isoLookup.get(parseInt(d.id, 10));
      return (c && c.country_code === selectedCountry.country_code) ? 2 : 0.35;
    });
}

function buildMapLegend(mapW) {
  const row = d3.select("#map-legend-row");
  const lW  = Math.min(260, mapW * 0.45);

  const svg  = row.append("svg").attr("width", lW + 80).attr("height", 36);
  const defs = svg.append("defs");
  const grad = defs.append("linearGradient").attr("id", "yrGrad").attr("x1","0%").attr("x2","100%");
  const sqrtScale = gdpColorScale._sqrtScale;
  const cap       = gdpColorScale._cap;
  d3.range(0, 1.01, 0.05).forEach(t => {
    const gdpVal   = t * cap;
    const colorPos = sqrtScale(gdpVal);
    grad.append("stop")
      .attr("offset",     (t * 100) + "%")
      .attr("stop-color", d3.interpolateYlOrRd(colorPos));
  });

  svg.append("text").attr("x", 32).attr("y", 12).attr("fill","#555").attr("font-size","9px")
    .attr("text-anchor","end").text("$0");
  svg.append("rect").attr("x", 34).attr("y", 4).attr("width", lW).attr("height", 10)
    .attr("rx", 2).style("fill","url(#yrGrad)");
  svg.append("text").attr("x", 36 + lW).attr("y", 12).attr("fill","#555").attr("font-size","9px")
    .text("↑ GDP");
  svg.append("text").attr("x", 34 + lW/2).attr("y", 23).attr("fill","#444").attr("font-size","8.5px")
    .attr("text-anchor","middle").text("GDP per Capita (USD, capped at 97th pct) — √ scale");
  svg.append("rect").attr("x", 34 + lW + 38).attr("y", 4).attr("width", 10).attr("height", 10)
    .attr("rx", 1).attr("fill","#2e2e3e");
  svg.append("text").attr("x", 34 + lW + 50).attr("y", 12).attr("fill","#444").attr("font-size","8.5px")
    .text("No data");
}


//  SCATTER PLOT — INIT

let scatterMargin, scatterW, scatterH;

function initScatter() {
  const el   = document.getElementById("scatter-svg");
  const rect = el.getBoundingClientRect();
  const W    = rect.width  || 560;
  const H    = rect.height || 420;

  scatterMargin = { top: 16, right: 20, bottom: 72, left: 62 };
  scatterW      = W - scatterMargin.left - scatterMargin.right;
  scatterH      = H - scatterMargin.top  - scatterMargin.bottom;

  const svg = d3.select("#scatter-svg");
  scatterG  = svg.append("g")
    .attr("transform", `translate(${scatterMargin.left},${scatterMargin.top})`);

  // Domains
  const allGdp = [];
  countriesArr.forEach(c => {
    YEARS.forEach(y => {
      const v = c.years[y]?.gdp_per_capita;
      if (v != null && isFinite(v) && v > 0) allGdp.push(v);
    });
  });
  allGdp.sort(d3.ascending);

  xScale = d3.scaleLinear().domain([0, 110000]).range([0, scatterW]).nice();
  yScale = d3.scaleLinear().domain([0, 160]).range([scatterH, 0]);

  // Grid
  scatterG.append("g").attr("class","grid")
    .attr("transform", `translate(0,${scatterH})`)
    .call(d3.axisBottom(xScale).ticks(6).tickSize(-scatterH).tickFormat(""));
  scatterG.append("g").attr("class","grid")
    .call(d3.axisLeft(yScale).ticks(7).tickSize(-scatterW).tickFormat(""));

  // Axes
  const xAxisG = scatterG.append("g")
    .attr("transform", `translate(0,${scatterH})`)
    .call(d3.axisBottom(xScale).ticks(6).tickFormat(d => "$" + d3.format("~s")(d)));
  const yAxisG = scatterG.append("g")
    .call(d3.axisLeft(yScale).ticks(7).tickFormat(d => d + "%"));

  [xAxisG, yAxisG].forEach(g => {
    g.selectAll("text").attr("fill","#666").attr("font-size","9.5px");
    g.selectAll(".domain,.tick line").attr("stroke","#333344");
  });

  // Axis labels
  scatterG.append("text").attr("class","axis-label")
    .attr("x", scatterW / 2).attr("y", scatterH + 52)
    .attr("text-anchor","middle").text("GDP per Capita (USD)");
  scatterG.append("text").attr("class","axis-label")
    .attr("transform","rotate(-90)")
    .attr("x", -scatterH / 2).attr("y", -50)
    .attr("text-anchor","middle").text("Secondary School Enrollment (%)");

  // Layers: traj behind dots, focus dot on top
  scatterG.append("g").attr("class","traj-layer");
  scatterG.append("g").attr("class","dots-layer");
  scatterG.append("g").attr("class","focus-layer");

  // "✕ Clear selection" button — SVG group, top-right of plot area
  clearBtnG = scatterG.append("g")
    .attr("class", "clear-btn-g")
    .attr("transform", `translate(${scatterW}, 0)`)
    .style("cursor", "pointer")
    .style("display", "none");

  clearBtnG.append("rect")
    .attr("x", -102).attr("y", -13)
    .attr("width", 102).attr("height", 17)
    .attr("rx", 8)
    .attr("fill", "#1a1a2e")
    .attr("stroke", "#444466")
    .attr("stroke-width", 0.8);
  clearBtnG.append("text")
    .attr("x", -51).attr("y", 0)
    .attr("text-anchor", "middle")
    .attr("fill", "#9999bb")
    .attr("font-family", "Segoe UI, Arial, sans-serif")
    .attr("font-size", "9.5px")
    .text("✕ Clear selection");
  clearBtnG.on("click", () => exitFocusMode());

  buildRegionButtons();
  renderDots();
}


//  SCATTER DOTS

function renderDots() {
  scatterG.select(".dots-layer")
    .selectAll(".scatter-dot")
    .data(countriesArr, d => d.country_code)
    .join(enter => enter.append("circle")
      .attr("class", "scatter-dot")
      .attr("r", 4)
      .attr("fill",         d => REGION_COLORS(d.region))
      .attr("stroke",       "#0f1117")
      .attr("stroke-width", 0.5)
    )
    .on("mouseover", function(event, d) {
      showTip(event, d);
      d3.select(this).attr("r", 6).raise();
    })
    .on("mousemove", moveTip)
    .on("mouseout",  function() {
      hideTip();
      d3.select(this).attr("r", 4);
    })
    .on("click", function(event, d) { handleCountrySelect(d); });

  // Set initial position + visibility
  applyDefaultMode();
}

// Shared attribute-setter for a dot selection using defaultDotState
function _applyDefaultDotAttrs(sel, transition) {
  const set = (s, attr, fn) => transition ? s.attr(attr, fn) : s.attr(attr, fn);
  return sel
    .attr("cx",           d => { const s = defaultDotState(d, selectedYear); return s.mode === "hide" ? -999 : s.cx; })
    .attr("cy",           d => { const s = defaultDotState(d, selectedYear); return s.mode === "hide" ? -999 : s.cy; })
    .attr("opacity",      d => { const s = defaultDotState(d, selectedYear); return s.mode === "full" ? 0.82 : s.mode === "ghost" ? 0.2 : 0; })
    .attr("stroke",       "#0f1117")
    .attr("stroke-width", 0.5);
}

// Sets all dots to their default-mode state (instant, no transition)
function applyDefaultMode() {
  const dots = scatterG.select(".dots-layer").selectAll(".scatter-dot");
  _applyDefaultDotAttrs(dots, false);
  dots
    .attr("r", 4)
    .style("pointer-events", d => defaultDotState(d, selectedYear).mode === "full" ? "auto" : "none")
    .style("cursor", "pointer");
}

// Slider update in default mode: smooth transition of positions + opacity
function updateDotsDefault() {
  const dots = scatterG.select(".dots-layer").selectAll(".scatter-dot");
  // pointer-events and cursor updated immediately (not transitionable)
  dots
    .style("pointer-events", d => defaultDotState(d, selectedYear).mode === "full" ? "auto" : "none")
    .style("cursor", "pointer");
  _applyDefaultDotAttrs(dots.transition().duration(450), true);
}


//  FOCUS MODE

function enterFocusMode(country) {
  selectedCountry = country;

  // Dim all background dots; keep hidden-region dots invisible
  const dots = scatterG.select(".dots-layer").selectAll(".scatter-dot");
  dots.style("pointer-events", "none").style("cursor", "default");
  dots.transition().duration(300)
    .attr("opacity", d => hiddenRegions.has(d.region) ? 0 : 0.06)
    .attr("r", 4)
    .attr("stroke", "#0f1117")
    .attr("stroke-width", 0.5);

  drawTrajectory(country);
  renderFocusDot(country);
  clearBtnG.style("display", null);
  updateMapHighlight();
}

function exitFocusMode() {
  selectedCountry = null;

  // Clear trajectory and focus dot layers
  scatterG.select(".traj-layer").selectAll("*").remove();
  scatterG.select(".focus-layer").selectAll("*").remove();

  // Restore background dots with a transition
  const dots = scatterG.select(".dots-layer").selectAll(".scatter-dot");
  dots
    .style("pointer-events", d => defaultDotState(d, selectedYear).mode === "full" ? "auto" : "none")
    .style("cursor", "pointer");
  _applyDefaultDotAttrs(dots.transition().duration(350), true).attr("r", 4);

  clearBtnG.style("display", "none");
  hideTip();
  updateMapHighlight();
}


//  TRAJECTORY PATH (focus mode)

function drawTrajectory(country) {
  const layer = scatterG.select(".traj-layer");
  layer.selectAll("*").remove();

  const pts = YEARS.map(y => {
    const x  = getScatterX(country, y);
    const yv = getScatterY(country, y);
    if (x === null || yv === null) return null;
    return { x, y: yv, year: y };
  }).filter(Boolean);

  if (pts.length < 2) return;

  const lineGen = d3.line().x(d => d.x).y(d => d.y).curve(d3.curveCatmullRom.alpha(0.5));

  layer.append("path")
    .datum(pts)
    .attr("class", "traj-path")
    .attr("d", lineGen);

  // Milestone tick marks (not interactive) at 2000, 2005, 2010, 2015, 2020
  const MILESTONES = new Set([2000, 2005, 2010, 2015, 2020]);
  const tickG = layer.append("g").style("pointer-events", "none");

  pts.filter(p => MILESTONES.has(p.year)).forEach(p => {
    // Small cross (+) at the milestone position
    tickG.append("line")
      .attr("x1", p.x - 4).attr("y1", p.y)
      .attr("x2", p.x + 4).attr("y2", p.y)
      .attr("stroke", "#8888aa").attr("stroke-width", 1.2);
    tickG.append("line")
      .attr("x1", p.x).attr("y1", p.y - 4)
      .attr("x2", p.x).attr("y2", p.y + 4)
      .attr("stroke", "#8888aa").attr("stroke-width", 1.2);
    // Year label above tick
    tickG.append("text")
      .attr("class", "traj-label")
      .attr("x", p.x)
      .attr("y", p.y - 7)
      .attr("text-anchor", "middle")
      .text(p.year);
  });
}


//  FOCUS DOT - single animated dot for selected country


// Scan backward from (year-1) to find the most recent year with both
// gdp and enrollment valid. Returns {x, y} in screen coords, or null.
function getLastKnownPos(country, year) {
  for (let y = year - 1; y >= 2000; y--) {
    const lx = getScatterX(country, y);
    const ly = getScatterY(country, y);
    if (lx !== null && ly !== null) return { x: lx, y: ly };
  }
  return null;
}

// Returns the display state for the focus dot at the current year.
//   mode "full"  — both values valid: show dot at data position
//   mode "ghost" — gdp valid, enrollment null: show faded dashed dot
//                  at last known valid position (or hide if none exists)
//   mode "hide"  — gdp missing: hide entirely
function focusDotState(country, year) {
  const x  = getScatterX(country, year);
  const yv = getScatterY(country, year);

  if (x !== null && yv !== null) {
    return { mode: "full",  cx: x,    cy: yv,   opacity: 1,   dash: null,  showLabel: true  };
  }
  if (x !== null) {
    const last = getLastKnownPos(country, year);
    if (last) {
      return { mode: "ghost", cx: last.x, cy: last.y, opacity: 0.3, dash: "4 3", showLabel: false };
    }
  }
  return { mode: "hide",  cx: -999, cy: -999, opacity: 0,   dash: null,  showLabel: false };
}

function renderFocusDot(country) {
  const layer = scatterG.select(".focus-layer");
  layer.selectAll("*").remove();

  const s = focusDotState(country, selectedYear);

  layer.append("circle")
    .attr("class",        "focus-dot")
    .attr("cx",           s.cx)
    .attr("cy",           s.cy)
    .attr("r",            7)
    .attr("fill",         REGION_COLORS(country.region))
    .attr("stroke",       "#ffffff")
    .attr("stroke-width", s.mode === "ghost" ? 1.5 : 2)
    .attr("stroke-dasharray", s.dash || null)
    .attr("opacity",      s.opacity)
    .style("cursor", "pointer")
    .on("mouseover", function(event) { showTip(event, country); })
    .on("mousemove", moveTip)
    .on("mouseout",  hideTip)
    .on("click",     () => handleCountrySelect(country));

  layer.append("text")
    .attr("class",       "focus-year-label")
    .attr("x",           s.showLabel ? s.cx + 11 : -999)
    .attr("y",           s.showLabel ? s.cy +  4 : -999)
    .attr("fill",        "#ffffff")
    .attr("font-size",   "9px")
    .attr("font-family", "Segoe UI, Arial, sans-serif")
    .style("pointer-events", "none")
    .text(selectedYear);
}

// Smoothly move the focus dot to the new year's position
function updateFocusDot() {
  if (!selectedCountry) return;
  const layer = scatterG.select(".focus-layer");
  const s = focusDotState(selectedCountry, selectedYear);

  layer.select(".focus-dot")
    .transition().duration(450)
    .attr("cx",               s.cx)
    .attr("cy",               s.cy)
    .attr("opacity",          s.opacity)
    .attr("stroke-width",     s.mode === "ghost" ? 1.5 : 2)
    .attr("stroke-dasharray", s.dash || null);

  layer.select(".focus-year-label")
    .transition().duration(450)
    .attr("x", s.showLabel ? s.cx + 11 : -999)
    .attr("y", s.showLabel ? s.cy +  4 : -999)
    .text(selectedYear);
}

//  REGION FILTER BUTTONS

function buildRegionButtons() {
  d3.select("#region-filters")
    .selectAll(".region-btn")
    .data(REGIONS)
    .join("button")
      .attr("class", "region-btn")
      .style("color",        d => REGION_COLORS(d))
      .style("border-color", d => REGION_COLORS(d))
      .text(d => REGION_SHORT[d])
      .on("click", function(event, d) {
        if (hiddenRegions.has(d)) {
          hiddenRegions.delete(d);
          d3.select(this).classed("hidden-region", false);
        } else {
          hiddenRegions.add(d);
          d3.select(this).classed("hidden-region", true);
        }

        if (!selectedCountry) {
          // Default mode: update visibility with transition
          const dots = scatterG.select(".dots-layer").selectAll(".scatter-dot");
          dots.style("pointer-events", dd => defaultDotVisible(dd) ? "auto" : "none");
          dots.transition().duration(220)
            .attr("opacity", dd => defaultDotVisible(dd) ? 0.82 : 0);
        }
        // In focus mode, region toggle has no visible effect on the dimmed context dots
      });
}

//  COUNTRY SELECTION HANDLER

function handleCountrySelect(country) {
  if (selectedCountry && selectedCountry.country_code === country.country_code) {
    // Same country clicked — exit focus mode
    exitFocusMode();
  } else {
    // New country (or first click) — enter / switch focus mode
    enterFocusMode(country);
  }
}

//  YEAR SLIDER

d3.select("#year-slider").on("input", function() {
  selectedYear = +this.value;
  d3.select("#year-display").text(selectedYear);
  updateMapColors();

  if (selectedCountry) {
    // Focus mode: animate the single focus dot; silently reposition context dots
    updateFocusDot();
    scatterG.select(".dots-layer").selectAll(".scatter-dot")
      .attr("cx", d => { const x = getScatterX(d, selectedYear); return x !== null ? x : -999; })
      .attr("cy", d => { const yv = getScatterY(d, selectedYear); return yv !== null ? yv : -999; });
  } else {
    // Default mode: smooth transition of all visible dots
    updateDotsDefault();
  }
});


//  MAIN — load data & initialise

async function main() {
  // countries.json has Python-serialised NaN — fix before parsing
  const [rawText, topo] = await Promise.all([
    fetch("data/countries.json").then(r => r.text()),
    fetch("data/world-110m.json").then(r => r.json())
  ]);

  const cleaned  = rawText.replace(/\bNaN\b/g, "null");
  const countries = JSON.parse(cleaned);

  countries.forEach(c => {
    countriesArr.push(c);
    isoLookup.set(c.iso_numeric, c);
    codeToIso.set(c.country_code, c.iso_numeric);
  });

  gdpColorScale = buildGdpColorScale();



  initMap(topo);
  initScatter();
}

main().catch(err => {
  console.error("Dashboard init error:", err);
  document.body.insertAdjacentHTML("beforeend",
    `<div style="color:#f66;padding:20px;font-size:14px">Error loading data: ${err.message}</div>`);
});
</script>
